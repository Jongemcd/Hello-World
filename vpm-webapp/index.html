<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPM - Visual Performance Management</title>
<link rel="stylesheet" href="styles.css">

<!-- Only needed once useMockData is false. Safe to leave in for local/mock use. -->
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>
</head>
<body>
  <div id="topbar">
    <div class="logo" id="logo">LOGO</div>
    <div class="app-title" id="app-name">VPM</div>
  </div>

  <div id="header">
    <h1 id="page-title">VPM - Summary Page</h1>
    <div class="actions">&#10227; &#9776;</div>
  </div>

  <div id="layout">
    <div id="sidebar">
      <div id="nav"></div>
      <div id="autoplay-bar">
        <button id="autoplay-btn">Press Play to Autoplay Screens</button>
      </div>
      <div id="profile">
        <div class="avatar">?</div>
        <div class="meta">
          <div class="name">Guest</div>
          <div>Sign-in not configured</div>
        </div>
      </div>
    </div>

    <div id="main"></div>
  </div>

  <script src="config.js"></script>
  <script src="data/mockData.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/graphService.js"></script>
  <script src="js/powerbiService.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
